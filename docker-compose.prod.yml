services:
  # PostgreSQL Database
  postgres-prod:
    image: postgres:16-alpine
    container_name: labs-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: labs_app
      POSTGRES_USER: labs_user
      POSTGRES_PASSWORD: labs_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - labs-network-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labs_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Laravel Backend
  backend-prod:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: labs-backend-prod
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - ./backend/storage:/var/www/storage
    ports:
      - "8001:8000"
    env_file:
      - ./backend/.env.production
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres-prod
      DB_PORT: 5432
      DB_DATABASE: labs_app
      DB_USERNAME: labs_user
      DB_PASSWORD: labs_password
    depends_on:
      postgres-prod:
        condition: service_healthy
    networks:
      - labs-network-prod
    command: php artisan serve --host=0.0.0.0 --port=8000

  # Next.js Frontend (Production Build)
  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: labs-frontend-prod
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - ./frontend/.env.production
    depends_on:
      - backend-prod
    networks:
      - labs-network-prod
    ports:
      - "3001:3000"

  # Nginx Reverse Proxy
  nginx-prod:
    image: nginx:alpine
    container_name: labs-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf
      - ./backend/public:/var/www/public
      - ./frontend/.next/static:/var/www/frontend/static:ro
    depends_on:
      - backend-prod
      - frontend-prod
    networks:
      - labs-network-prod

volumes:
  postgres_data_prod:
    driver: local

networks:
  labs-network-prod:
    driver: bridge

